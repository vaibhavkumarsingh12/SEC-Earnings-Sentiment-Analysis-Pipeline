<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sleek Dark Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="positiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* --- Keyframes & Animations --- */
      @keyframes dash {
        to {
          stroke-dashoffset: -40;
        }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      @keyframes pulse {
        0%, 100% { r: 5; opacity: 0.4; }
        50% { r: 9; opacity: 0.9; }
      }
      
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.4; }
      }

      @keyframes drawLine {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* --- Classes --- */
      .flow-line {
        stroke: url(#primaryGrad);
        stroke-width: 3;
        stroke-linecap: round;
        fill: none;
        stroke-dasharray: 8, 4;
        animation: dash 2s linear infinite;
        filter: url(#glow);
      }

      .static-grid {
        stroke: #334155;
        stroke-width: 0.5;
        opacity: 0.15;
      }
      
      .node-pulse {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: url(#glow);
      }
      
      .node-p1 { animation-delay: 0s; fill: #3b82f6; }
      .node-p2 { animation-delay: 0.7s; fill: #8b5cf6; }
      .node-p3 { animation-delay: 1.4s; fill: #ec4899; }
      .node-p4 { animation-delay: 2.1s; fill: #10b981; }

      .card-float {
        animation: float 5s ease-in-out infinite;
      }
      .c1 { animation-delay: 0s; }
      .c2 { animation-delay: 2.5s; }

      .title-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 800;
        fill: #ffffff;
        font-size: 24px;
        letter-spacing: -0.03em;
      }

      .subtitle-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 500;
        fill: #94a3b8;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      
      .stat-label {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        fill: #64748b;
        font-size: 9px;
        text-transform: uppercase;
      }
      
      .stat-value {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        fill: #10b981;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Glowing background shapes -->
  <circle cx="100" cy="120" r="160" fill="#3b82f6" opacity="0.04" filter="blur(40px)" />
  <circle cx="700" cy="120" r="160" fill="#ec4899" opacity="0.04" filter="blur(40px)" />

  <!-- Grid Overlay (Scientific/Financial aesthetic) -->
  <g class="static-grid">
    <!-- Horizontal gridlines -->
    <line x1="50" y1="40" x2="750" y2="40" />
    <line x1="50" y1="80" x2="750" y2="80" />
    <line x1="50" y1="120" x2="750" y2="120" />
    <line x1="50" y1="160" x2="750" y2="160" />
    <line x1="50" y1="200" x2="750" y2="200" />
    
    <!-- Vertical gridlines -->
    <line x1="100" y1="30" x2="100" y2="210" />
    <line x1="225" y1="30" x2="225" y2="210" />
    <line x1="350" y1="30" x2="350" y2="210" />
    <line x1="475" y1="30" x2="475" y2="210" />
    <line x1="600" y1="30" x2="600" y2="210" />
  </g>

  <!-- Interactive Financial Curve / Flow Line -->
  <!-- Renders an elegant financial chart wave across the bottom -->
  <path class="flow-line" d="M 50 180 C 120 160, 160 80, 225 100 C 290 120, 310 190, 375 160 C 440 130, 460 60, 525 70 C 590 80, 620 170, 685 150 C 720 140, 735 110, 750 100" />
  
  <!-- Under-curve Area Gradient -->
  <path d="M 50 180 C 120 160, 160 80, 225 100 C 290 120, 310 190, 375 160 C 440 130, 460 60, 525 70 C 590 80, 620 170, 685 150 C 720 140, 735 110, 750 100 L 750 210 L 50 210 Z" fill="url(#positiveGrad)" opacity="0.04" />

  <!-- Interactive Nodes (Pulsing Signals on the line) -->
  <circle class="node-pulse node-p1" cx="225" cy="100" r="6" />
  <circle class="node-pulse node-p2" cx="375" cy="160" r="6" />
  <circle class="node-pulse node-p3" cx="525" cy="70" r="6" />
  <circle class="node-pulse node-p4" cx="685" cy="150" r="6" />
  
  <!-- Subtly Floating Card Overlays (representing NLP metadata) -->
  <!-- Card 1: FinBERT -->
  <g class="card-float c1" transform="translate(160, 35)">
    <rect width="115" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-opacity="0.5" stroke-width="1" filter="url(#subtleGlow)" />
    <text x="12" y="18" class="stat-label">Model: FinBERT</text>
    <text x="12" y="32" class="stat-value" fill="#60a5fa">Polarity: +0.482</text>
    <!-- Little spark line in card -->
    <path d="M 90 28 L 95 24 L 100 29 L 105 20" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
  </g>
  
  <!-- Card 2: Market CAR -->
  <g class="card-float c2" transform="translate(565, 30)">
    <rect width="115" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-opacity="0.5" stroke-width="1" filter="url(#subtleGlow)" />
    <text x="12" y="18" class="stat-label">Market: CAR [+1, +3]</text>
    <text x="12" y="32" class="stat-value" fill="#34d399">Return: +8.42%</text>
    <!-- Little bar graph in card -->
    <rect x="90" y="27" width="3" height="7" fill="#34d399" rx="0.5" />
    <rect x="95" y="23" width="3" height="11" fill="#34d399" rx="0.5" />
    <rect x="100" y="20" width="3" height="14" fill="#34d399" rx="0.5" />
  </g>

  <!-- LOGO BRANDING -->
  <g transform="translate(50, 45)">
    <rect width="36" height="36" rx="8" fill="url(#primaryGrad)" filter="url(#glow)" />
    <text x="18" y="25" font-family="'Outfit', sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle">S</text>
  </g>

  <!-- TEXT LAYOUT (Renders beautifully on top) -->
  <text x="100" y="58" class="title-text">SEC Earnings Sentiment Analysis Pipeline</text>
  <text x="100" y="76" class="subtitle-text">Dual NLP (FinBERT &amp; Lexicon) / Aligned Market Returns &amp; EPS Surprises</text>
  
  <!-- Pipeline step badges -->
  <g transform="translate(100, 95)" font-family="'Inter', sans-serif" font-size="9" font-weight="700">
    <!-- EDGAR Download -->
    <rect width="90" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5" />
    <circle cx="8" cy="8" r="3" fill="#3b82f6" />
    <text x="16" y="11" fill="#cbd5e1">1. SEC DOWNLOAD</text>
    
    <!-- MD&A Clean -->
    <g transform="translate(96, 0)">
      <rect width="80" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5" />
      <circle cx="8" cy="8" r="3" fill="#8b5cf6" />
      <text x="16" y="11" fill="#cbd5e1">2. MD&amp;A CLEAN</text>
    </g>
    
    <!-- FinBERT Sentiment -->
    <g transform="translate(182, 0)">
      <rect width="98" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5" />
      <circle cx="8" cy="8" r="3" fill="#ec4899" />
      <text x="16" y="11" fill="#cbd5e1">3. SENTIMENT NLP</text>
    </g>

    <!-- yfinance Align -->
    <g transform="translate(286, 0)">
      <rect width="86" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5" />
      <circle cx="8" cy="8" r="3" fill="#10b981" />
      <text x="16" y="11" fill="#cbd5e1">4. MARKET ALIGN</text>
    </g>

    <!-- Correlation Analysis -->
    <g transform="translate(378, 0)">
      <rect width="98" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5" />
      <circle cx="8" cy="8" r="3" fill="#f59e0b" />
      <text x="16" y="11" fill="#cbd5e1">5. CORRELATIONS</text>
    </g>
  </g>
  
</svg>
